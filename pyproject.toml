[project]
name = "aside-telegram"
version = "0.1.0"
description = "Telegram bot wrapping a Claude Agent SDK agent with the Aside browser MCP"
readme = "README.md"
authors = [
    { name = "Emanuilo Jovanovic", email = "emanuilo.jovanovic@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=21",
]

[project.scripts]
aside-telegram = "aside_telegram:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
